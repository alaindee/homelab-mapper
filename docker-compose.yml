services:
  homelab-map:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: homelab-map
    restart: unless-stopped
    # Uncomment to require HTTP Basic Auth on the whole app (recommended
    # if this is reachable beyond your trusted LAN):
    # environment:
    #   - ADMIN_USERNAME=admin
    #   - ADMIN_PASSWORD=change_me
    volumes:
      - ./volumes/homelab-map:/data
    ports:
      - "5000:5000"
    networks:
      - homelab-map-network

networks:
  homelab-map-network:
    driver: bridge
    name: homelab-map-network
